<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stephen Olamide | Author Growth Partner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%23101D32'/%3E%3Ctext%20x='32'%20y='44'%20font-family='Georgia,serif'%20font-size='30'%20fill='%23B79A62'%20text-anchor='middle'%3ESO%3C/text%3E%3C/svg%3E">
<meta name="description" content="Proofreading, book design, publishing preparation, Amazon listing optimization, and marketing support for authors, from Stephen Olamide, Author Growth Partner.">
<meta name="author" content="Stephen Olamide">
<meta name="theme-color" content="#101D32">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stephen Olamide">
<meta property="og:title" content="Stephen Olamide | Author Growth Partner">
<meta property="og:description" content="Proofreading, book design, publishing preparation, Amazon listing optimization, and marketing support for authors who want their books presented properly.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#101D32;--deep:#0A1423;--navy2:#1B2D4A;--ivory:#F3EEE3;--soft:#FAF8F2;--gold:#B79A62;--gold2:#8E7440;--goldl:#D2BE8E;--ink:#1D2433;--line:#E2DBC9}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:90px}
body{font:400 16px/1.65 Inter,sans-serif;color:var(--ink);background:var(--soft)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;line-height:1.15;color:var(--navy);font-weight:500}
a{color:inherit}img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
section{padding:80px 0}.alt{background:var(--ivory)}.navy,.navy h1,.navy h2,.navy h3{background:var(--navy);color:var(--soft)}.navy h1,.navy h2,.navy h3{background:none}.deep{background:var(--deep)}
.eyebrow{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);margin-bottom:18px}.eyebrow.lt,.lt{color:var(--goldl)}.lede.lt,p.lt{color:#F3EEE3b3}
h1{font-size:clamp(2.1rem,5vw,4rem);max-width:19ch}h2{font-size:clamp(1.8rem,3.3vw,2.7rem);max-width:24ch}h3{font-size:1.3rem}
.lede{max-width:60ch;margin-top:18px;opacity:.85}.mut{opacity:.65;font-size:.94rem}
header.bar{position:fixed;inset:0 0 auto;z-index:9;background:#FAF8F2f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:20px}
.wm{font:600 1.6rem Georgia,serif;color:var(--navy);text-decoration:none;line-height:1}.wm small{display:block;font:500 9px 'JetBrains Mono',monospace;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2);margin-top:6px}.navy .wm,.wm.lt{color:var(--soft)}
nav{display:flex;gap:22px}nav a{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;opacity:.6;padding:6px 0;border-bottom:1px solid transparent}nav a.on,nav a:hover{opacity:1;border-color:var(--gold)}
#mb{display:none;background:none;border:0;font-size:26px;color:var(--navy)}
.btn{display:inline-block;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:15px 26px;margin:0 12px 12px 0;border:1px solid var(--gold)}
.gold{background:var(--gold);color:var(--deep)}.gold:hover{background:var(--goldl)}.line{color:var(--soft);border-color:#F3EEE34d}.dk{background:var(--navy);color:var(--soft);border-color:var(--navy)}
.hero{padding:150px 0 90px}.two{display:grid;grid-template-columns:7fr 5fr;gap:50px;align-items:center}.portrait{max-height:520px;width:100%;object-fit:contain;border:1px solid #B79A6266;padding:12px}
.page{padding:150px 0 70px}.row{display:grid;grid-template-columns:50px 4fr 4fr 2fr;gap:28px;padding:34px 0;border-bottom:1px solid var(--line)}.row b{color:var(--gold2);font-weight:500}.row>a{text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:34px;margin-top:44px}.grid>div{border-top:1px solid #1018;padding-top:18px}.grid p{margin-top:8px;font-size:.94rem;opacity:.75}
.ul{list-style:none;padding:0;margin:10px 0}.ul li{padding:4px 0 4px 16px;position:relative;font-size:.94rem}.ul li:before{content:'';position:absolute;left:0;top:14px;width:5px;height:5px;background:var(--gold)}
.svc{padding:44px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:4fr 8fr;gap:40px}.svc h4{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin:16px 0 4px}
.case{display:grid;grid-template-columns:5fr 7fr;gap:50px;align-items:center}.cover{max-width:320px;box-shadow:0 24px 60px -30px #101D3273}
form{display:grid;gap:16px;background:#fff;border:1px solid var(--line);padding:32px}label{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.65;display:grid;gap:6px}
input,textarea{font:inherit;padding:12px;border:1px solid var(--line);width:100%}input:focus,textarea:focus{outline:2px solid var(--gold)}.chips label{display:flex;gap:8px;text-transform:none;letter-spacing:0;font:400 14px Inter;opacity:1}.chips input{width:auto}.ok{padding:30px;border:1px solid var(--gold)}
footer{padding:56px 0 30px;font-size:.92rem}footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px}footer a{display:block;opacity:.7;text-decoration:none;padding:3px 0}footer .c{grid-column:1/-1;border-top:1px solid #F3EEE31a;padding-top:20px;opacity:.45;font-size:.8rem}
iframe{width:100%;height:80vh;border:1px solid var(--line)}
@media(max-width:900px){nav{display:none;position:absolute;top:76px;left:0;right:0;flex-direction:column;background:var(--deep);padding:20px 24px}nav.open{display:flex}nav a{color:var(--soft)}#mb{display:block}.two,.case,.svc,.row,footer .wrap{grid-template-columns:1fr}.row>a{text-align:left}}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="wm" href="/">Stephen Olamide<small>Author Growth Partner</small></a><nav id="nav"></nav><button id="mb" aria-label="Menu">&#9776;</button></div></header>
<main id="app"></main>
<footer class="navy deep"><div class="wrap"><div><a class="wm lt" href="/" style="opacity:1">Stephen Olamide</a><p class="mut" style="margin-top:12px;max-width:34ch">Support for the work that follows the manuscript: proofreading, book design, publishing preparation, Amazon listing optimization, and visibility.</p></div><div id="fs"></div><div><a id="fm" href="#"></a><a href="/contact">Start a project</a></div><div class="c">&copy; <span id="yr"></span> Stephen Olamide. All rights reserved.</div></div></footer>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const L=a=>`<ul class="ul">${(a||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul>`;
const B=(h,t,c='gold')=>`<a class="btn ${c}" href="${h}">${t}</a>`;
const H=(k,t,l,d)=>`<div class="eyebrow${d?' lt':''}">${E(k)}</div><h2>${E(t)}</h2>${l?`<p class="lede${d?' lt':''}">${E(l)}</p>`:''}`;
const S=(c,x)=>`<section class="${c}"><div class="wrap">${x}</div></section>`;
const top=(k,t,l)=>`<header class="navy page"><div class="wrap">${H(k,t,l,1).replace('<h2','<h1').replace('</h2>','</h1>')}</div></header>`;
const IMG=(s,a,c='')=>s?`<img class="${c}" src="${E(s)}" alt="${E(a)}" loading="lazy">`:'';
const nav=[['/','Home'],['/services','Services'],['/amazon-optimization','Amazon Optimization'],['/portfolio','Portfolio'],['/about','About'],['/contact','Contact']];
let D;
const cta=()=>S('navy',`<div style="text-align:center"><div class="eyebrow lt">Start here</div><h2 style="margin:0 auto">Every book deserves thoughtful preparation and presentation.</h2><p class="lede lt" style="margin:18px auto 30px">Tell me where your book is now, whether that is a manuscript, finished files or a published listing, and we can work out what would actually help.</p>${B('/contact','Start Your Book Project')}${B('/services','Review the services','line')}</div>`);
const svcRows=()=>S('alt',H('Services','Five service families, one continuous journey.','Each stage of preparing a book solves a different problem. Most authors need two or three of them, not all five.')+D.services.map((s,i)=>`<article class="row"><b>0${i+1}</b><div><h3>${E(s.title)}</h3><p class="mut">${E(s.lede)}</p></div><p class="mut">${E(s.problem)}</p><a href="${s.href||'/services#s'+i}">Explore</a></article>`).join(''));
const probs=()=>S('',H('Why it matters','Where books lose their advantage.','These are the ordinary, fixable problems that appear between a finished manuscript and a published book.')+`<div class="grid">${D.problems.map(p=>`<div><h3>${E(p.title)}</h3><p>${E(p.body)}</p></div>`).join('')}</div>`);
const proc=()=>S('alt',H('Process','How we work together.','Four stages, agreed before any work begins, so you always know what is happening and what comes next.')+`<div class="grid">${D.process.map(p=>`<div><h3>${E(p.title)}</h3><p>${E(p.text)}</p></div>`).join('')}</div>`);
const proj=()=>{const p=D.projects.find(x=>x.published!==false);return p?S('',`<div class="case"><a href="/portfolio/${E(p.id)}">${IMG(p.cover_image,p.title+' by '+p.author,'cover')}</a><div><div class="eyebrow">Selected work</div><h2>${E(p.title)}</h2><p class="mut">${E(p.author)}</p><p style="margin:16px 0">${E(p.description)}</p>${L(p.highlights)}<a href="/portfolio/${E(p.id)}">View the full case study</a></div></div>`):''};
const tests=()=>D.testimonials?.length?S('alt',H('Kind words','What authors say.')+`<div class="grid">${D.testimonials.map(t=>`<div><p>&ldquo;${E(t.quote)}&rdquo;</p><p class="mut">${E(t.name)}${t.role?', '+E(t.role):''}</p></div>`).join('')}</div>`):'';
const faqs=()=>D.faqs?.length?S('',H('FAQ','Common questions.')+D.faqs.map(f=>`<details style="padding:14px 0;border-bottom:1px solid var(--line)"><summary><b>${E(f.question)}</b></summary><p style="margin-top:8px">${E(f.answer)}</p></details>`).join('')):'';
const pages={
'/':()=>`<section class="navy hero"><div class="wrap two"><div><a class="wm lt" href="/">Stephen Olamide</a><div class="eyebrow lt" style="margin-top:18px">Author Growth Partner</div><h1>${E(D.hero.headline)}</h1><p class="lede lt" style="margin:24px 0 34px">${E(D.hero.intro)}</p>${B('/services','Explore My Services')}${B('/contact','Discuss Your Book','line')}</div>${IMG(D.settings.hero_portrait,'Stephen Olamide, Author Growth Partner','portrait')}</div></section>`+S('',`<div class="eyebrow">${E(D.intro.eyebrow)}</div><h2>${E(D.intro.title)}</h2>${D.intro.body.map(p=>`<p class="lede">${E(p)}</p>`).join('')}`)+svcRows()+probs()+proj()+proc()+tests()+cta(),
'/services':()=>top('Services','Everything between a finished manuscript and a published book.','Five areas of work: the manuscript, the design, the production files, the Amazon listing, and the promotion around the book.')+D.services.map((s,i)=>S('',`<div class="svc" id="s${i}" style="border:0"><div><h2 style="font-size:1.9rem">${E(s.title)}</h2><p class="mut" style="margin:12px 0 20px">${E(s.lede)}</p>${B(s.href||'/contact',s.cta||'Discuss this service','dk')}</div><div><h4>The problem it addresses</h4><p>${E(s.problem)}</p><h4>What is included</h4>${L(s.includes)}<h4>What you receive</h4><p>${E(s.receive)}</p></div></div>`)).join('')+cta(),
'/amazon-optimization':()=>top('Amazon Book Listing Optimization',D.amazon.title,D.amazon.intro)+S('',H('The review','What I examine.')+`<div class="grid">${D.amazon.examine.map(x=>`<div><h3>${E(x.title)}</h3><p>${E(x.body)}</p></div>`).join('')}</div>`)+S('alt',H('How the audit works','A diagnostic review first. Implementation only if you want it.')+`<div class="grid">${D.amazon.steps.map(x=>`<div><h3>${E(x.title)}</h3><p>${E(x.text)}</p></div>`).join('')}</div><p class="mut" style="margin-top:30px;max-width:70ch">${E(D.amazon.note)}</p><p style="margin-top:24px">${B('/contact#form','Request a Book Listing Audit')}</p>`)+cta(),
'/portfolio':()=>top('Portfolio','Case studies.')+S('',`<div class="grid">${D.projects.filter(p=>p.published!==false).map(p=>`<a href="/portfolio/${E(p.id)}" style="text-decoration:none">${IMG(p.cover_image,p.title,'cover')}<h3 style="margin-top:14px">${E(p.title)}</h3><p class="mut">${E(p.author)}</p></a>`).join('')||'<p>Case studies are being prepared.</p>'}</div>`),
'case':id=>{const p=D.projects.find(x=>x.id===id);return top('Case study',p?p.title:'Not found',p?'By '+p.author:'')+(p?S('',`<div class="case">${IMG(p.cover_image,p.title,'cover')}<div><p>${E(p.description)}</p>${L(p.highlights)}</div></div>${p.case_study_pdf?`<iframe src="${E(p.case_study_pdf)}" title="${E(p.title)} case study" style="margin-top:40px"></iframe>`:''}`):S('','<p>This case study is not available.</p>'))},
'/about':()=>top('Author Growth Partner','Stephen Olamide','I work with authors on everything that follows the finished manuscript.')+S('',`<div class="two">${IMG(D.settings.about_photo,'Stephen Olamide','portrait')}<div>${D.about.map(p=>`<p style="margin-bottom:18px">${E(p)}</p>`).join('')}</div></div>`)+faqs()+cta(),
'/contact':()=>top('Contact','Tell me about your book.','Send me the details and I will tell you what would help.')+S('',`<form id="form"><label>Full name<input name="name" required></label><label>Email address<input name="email" type="email" required></label><label>Book title<input name="book_title"></label><label>Amazon link or ASIN (for listing work)<input name="amazon_link"></label><div class="chips"><label>Services</label>${D.services.map(s=>`<label><input type="checkbox" name="svc" value="${E(s.title)}">${E(s.title)}</label>`).join('')}</div><label>About your book and what you need<textarea name="message" rows="5" required></textarea></label><button class="btn gold" style="cursor:pointer">Send project details</button></form>`)+faqs()
};
function route(){let p=location.pathname.replace(/\/+$/,'')||'/',m=p.match(/^\/portfolio\/(.+)/);
 $('#app').innerHTML=m?pages.case(decodeURIComponent(m[1])):(pages[p]||pages['/'])();
 const k=m?'/portfolio':p;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===k));
 const h=$('#app h1');document.title=(p==='/'?'':(h?h.textContent+' | ':''))+'Stephen Olamide | Author Growth Partner';
 $('#nav').classList.remove('open');const t=location.hash&&document.getElementById(location.hash.slice(1));t?t.scrollIntoView():scrollTo(0,0)}
async function boot(){try{D=await (await fetch('/content/site.json')).json()}catch(e){$('#app').innerHTML='<section><div class="wrap"><p>Content could not be loaded.</p></div></section>';return}
 $('#nav').innerHTML=nav.map(n=>`<a href="${n[0]}">${n[1]}</a>`).join('');$('#yr').textContent=new Date().getFullYear();
 $('#fs').innerHTML=D.services.map(s=>`<a href="${s.href||'/services'}">${E(s.title)}</a>`).join('');const m=$('#fm');m.href='mailto:'+D.settings.email;m.textContent=D.settings.email;route()}
document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="/"]'),h=a&&a.getAttribute('href');if(a&&!a.target&&!ev.metaKey&&!ev.ctrlKey&&!h.startsWith('/admin')&&!h.startsWith('/assets')){ev.preventDefault();history.pushState(0,'',h);route()}});
addEventListener('popstate',route);$('#mb').onclick=()=>$('#nav').classList.toggle('open');
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f));delete d.svc;d.services=[...f.querySelectorAll('[name=svc]:checked')].map(x=>x.value).join(', ');const u=D.settings.form_endpoint;
 if(u){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)}).catch(()=>({ok:false}));f.outerHTML=`<p class="ok">${r.ok?'Thank you. Your details have been received.':'Something went wrong sending the form. Please email me directly.'}</p>`}
 else location.href=`mailto:${D.settings.email}?subject=${encodeURIComponent('Book Project Inquiry')}&body=${encodeURIComponent(Object.entries(d).map(([k,v])=>k+': '+v).join('\n'))}`});
boot();
</script>
</body>
</html>
